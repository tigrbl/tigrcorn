name: publish-wt-peer-probes

on:
  push:
    tags:
      - "v*"
  release:
    types: [prereleased, published]
  workflow_dispatch:
    inputs:
      publish_to_npmjs:
        description: Publish @tigrcorn/wt-peer-probes to npmjs.
        type: boolean
        required: false
        default: true
      create_github_release:
        description: Create or update the GitHub release for the probe package.
        type: boolean
        required: false
        default: true
      dry_run:
        description: Run npm publish in dry-run mode.
        type: boolean
        required: false
        default: false

jobs:
  ci:
    name: probe-package-ci
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate WebTransport peer probe package
        uses: cobycloud/actions/actions/setup-node-project@main
        with:
          node-version: "22"
          working-directory: packages/wt-peer-probes
          install-command: npm ci --workspaces=false
          build-command: npm run build --workspaces=false
          test-command: npm test --workspaces=false
      - name: Pack WebTransport peer probe package
        working-directory: packages/wt-peer-probes
        run: npm pack
      - name: Upload WebTransport peer probe tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wt-peer-probes-${{ github.sha }}
          path: packages/wt-peer-probes/tigrcorn-wt-peer-probes-*.tgz

  github-release:
    name: gh-release
    needs: ci
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_github_release }}
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download WebTransport peer probe tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wt-peer-probes-${{ github.sha }}
          path: .artifacts/wt-peer-probes
      - name: Create or update GitHub release
        uses: cobycloud/actions/actions/github-release@main
        with:
          tag-name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body-path: RELEASE_NOTES_0.3.9.md
          files: .artifacts/wt-peer-probes/*.tgz
          draft: "false"
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease }}
          make-latest: legacy
          token: ${{ github.token }}

  npmjs:
    name: npmjs-publish
    needs: ci
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_npmjs }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish WebTransport peer probe package
        uses: cobycloud/actions/actions/npm-publish@main
        with:
          node-version: "22"
          package-directory: packages/wt-peer-probes
          scope: "@tigrcorn"
          npm-token: ${{ secrets.NPM_TOKEN }}
          install-command: npm ci --workspaces=false
          build-command: npm run build --workspaces=false
          test-command: npm test --workspaces=false
          access: public
          provenance: "true"
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
