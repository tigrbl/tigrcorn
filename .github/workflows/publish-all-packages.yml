name: publish-all-packages

on:
  release:
    types: [prereleased, published]
  workflow_dispatch:
    inputs:
      gh_release:
        description: Create or update the GitHub release with selected package artifacts.
        type: boolean
        required: false
        default: true
      pypi_publish:
        description: Publish selected Python distributions to TestPyPI/PyPI when event rules allow it.
        type: boolean
        required: false
        default: true
      npmjs_publish:
        description: Publish @tigrcorn/wt-peer-probes to npmjs.
        type: boolean
        required: false
        default: true
      package_selection:
        description: Package set to publish.
        type: choice
        required: true
        default: all
        options:
          - all
          - tigrcorn core packages
          - probes
          - tigrcorn
          - tigrcorn-asgi
          - tigrcorn-certification
          - tigrcorn-compat
          - tigrcorn-config
          - tigrcorn-contract
          - tigrcorn-core
          - tigrcorn-http
          - tigrcorn-observability
          - tigrcorn-protocols
          - tigrcorn-runtime
          - tigrcorn-security
          - tigrcorn-static
          - tigrcorn-transports
          - wt-peer-probes
      dry_run:
        description: Run npm publish in dry-run mode.
        type: boolean
        required: false
        default: false

jobs:
  python-dist:
    name: python-dist
    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.pypi_publish || inputs.gh_release) && inputs.package_selection != 'probes' && inputs.package_selection != 'wt-peer-probes') }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install build tooling
        run: python -m pip install build
      - name: Discover Python package paths
        shell: bash
        env:
          PACKAGE_SELECTION: ${{ inputs.package_selection || 'all' }}
        run: |
          rm -rf dist .artifacts
          mkdir -p .artifacts/release-assets .artifacts/pages
          python - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          selection = os.environ.get("PACKAGE_SELECTION") or "all"
          root = Path(".")
          package_paths = [root]
          workspace_package_paths = sorted(path.parent for path in Path("pkgs").glob("*/pyproject.toml"))
          package_paths.extend(workspace_package_paths)

          by_name = {}
          for path in package_paths:
              metadata = tomllib.loads((path / "pyproject.toml").read_text(encoding="utf-8"))
              by_name[metadata["project"]["name"]] = path

          if selection in {"all", "tigrcorn core packages"}:
              selected = package_paths
          elif selection in by_name:
              selected = [by_name[selection]]
          else:
              raise SystemExit(f"selection does not include Python packages: {selection}")

          Path(".artifacts/python-workspace-package-paths.txt").write_text(
              "".join(f"{path.as_posix()}\n" for path in workspace_package_paths),
              encoding="utf-8",
          )
          Path(".artifacts/python-package-paths.txt").write_text(
              "".join(f"{path.as_posix()}\n" for path in selected),
              encoding="utf-8",
          )

          for path in selected:
              print(path.as_posix())
          PY
          cat .artifacts/python-package-paths.txt
      - name: Install workspace packages
        shell: bash
        run: |
          args=()
          while IFS= read -r package_dir; do
            args+=("-e" "$package_dir")
          done < .artifacts/python-workspace-package-paths.txt
          python -m pip install "${args[@]}"
      - name: Install project
        run: python -m pip install -e ".[certification,dev]"
      - name: Build certification and release metadata
        shell: bash
        run: |
          bash ./scripts/ci/validate.sh
          while IFS= read -r package_dir; do
            python -m build --outdir dist "$package_dir"
          done < .artifacts/python-package-paths.txt

          for file in RELEASE_NOTES_*.md; do
            [[ -e "$file" ]] && cp "$file" .artifacts/release-assets/
            [[ -e "$file" ]] && cp "$file" .artifacts/pages/
          done

          for file in \
            docs/conformance/claim_rep.json \
            docs/conformance/claim_rep.md \
            docs/conformance/risk_stat.json \
            docs/conformance/risk_stat.md \
            docs/conformance/evidence_ix.json \
            docs/conformance/evidence_ix.md \
            docs/conformance/release_auto.json \
            docs/conformance/relnotes.json \
            docs/conformance/relnotes.md \
            docs/review/conformance/state/CURRENT_REPOSITORY_STATE.md; do
            [[ -e "$file" ]] && cp "$file" .artifacts/release-assets/
          done

          cp README.md .artifacts/pages/
          cp -R docs .artifacts/pages/docs
      - name: Capture version
        id: meta
        shell: bash
        run: |
          python - <<'PY' > .artifacts/version.txt
          import pathlib

          root = pathlib.Path(".")
          for line in (root / "pyproject.toml").read_text(encoding="utf-8").splitlines():
              if line.startswith("version = "):
                  print(line.split('"')[1])
                  break
          else:
              raise SystemExit("version not found")
          PY
          echo "version=$(cat .artifacts/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-dist-${{ github.sha }}
          path: dist/
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets-${{ github.sha }}
          path: .artifacts/release-assets/
      - name: Attest Python distributions
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: dist/*
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .artifacts/pages

  publish-python-testpypi:
    name: python-testpypi-publish
    needs: python-dist
    if: ${{ github.event_name == 'release' && github.event.release.prerelease && (github.event_name != 'workflow_dispatch' || (inputs.pypi_publish && inputs.package_selection != 'probes' && inputs.package_selection != 'wt-peer-probes')) }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-dist-${{ github.sha }}
          path: dist
      - name: Publish Python distributions to TestPyPI
        if: github.event_name == 'release' && github.event.release.prerelease
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-python-pypi:
    name: python-pypi-publish
    needs: python-dist
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.pypi_publish && inputs.package_selection != 'probes' && inputs.package_selection != 'wt-peer-probes')) && (github.event_name != 'release' || github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-dist-${{ github.sha }}
          path: dist
      - name: Publish Python distributions to PyPI
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  wt-peer-probes-ci:
    name: wt-peer-probes-ci
    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.npmjs_publish || inputs.gh_release) && (inputs.package_selection == 'all' || inputs.package_selection == 'probes' || inputs.package_selection == 'wt-peer-probes')) }}
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/wt-peer-probes/package-lock.json
      - name: Install WebTransport peer probe dependencies
        working-directory: packages/wt-peer-probes
        run: npm ci --workspaces=false
      - name: Build WebTransport peer probe package
        working-directory: packages/wt-peer-probes
        run: npm run build --workspaces=false
      - name: Test WebTransport peer probe package
        working-directory: packages/wt-peer-probes
        run: npm test --workspaces=false
      - name: Pack WebTransport peer probe package
        working-directory: packages/wt-peer-probes
        run: npm pack
      - name: Upload WebTransport peer probe tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wt-peer-probes-${{ github.sha }}
          path: packages/wt-peer-probes/tigrcorn-wt-peer-probes-*.tgz

  wt-peer-probes-browser-tests:
    name: wt-peer-probes-browser-tests
    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.npmjs_publish || inputs.gh_release) && (inputs.package_selection == 'all' || inputs.package_selection == 'probes' || inputs.package_selection == 'wt-peer-probes')) }}
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/wt-peer-probes/package-lock.json
      - name: Install WebTransport peer probe dependencies
        working-directory: packages/wt-peer-probes
        run: npm ci --workspaces=false
      - name: Install Playwright browsers
        working-directory: packages/wt-peer-probes
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build WebTransport peer probe package
        working-directory: packages/wt-peer-probes
        run: npm run build --workspaces=false
      - name: Validate browser WebTransport peer API probes
        working-directory: packages/wt-peer-probes
        run: npm run test:peer-api -- --reporter=line
      - name: Upload WebTransport peer probe Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wt-peer-probes-playwright-${{ github.sha }}
          path: packages/wt-peer-probes/playwright-report/
          if-no-files-found: ignore

  publish-wt-peer-probes-github-release:
    name: wt-peer-probes-github-release
    needs: [wt-peer-probes-ci, wt-peer-probes-browser-tests]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.gh_release && (inputs.package_selection == 'all' || inputs.package_selection == 'probes' || inputs.package_selection == 'wt-peer-probes')) }}
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download WebTransport peer probe tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wt-peer-probes-${{ github.sha }}
          path: .artifacts/wt-peer-probes
      - name: Create or update GitHub release with probe package
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES_0.3.15.md
          files: .artifacts/wt-peer-probes/*.tgz
          draft: false
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease }}
          make_latest: legacy

  publish-wt-peer-probes-npmjs:
    name: wt-peer-probes-npmjs-publish
    needs: [wt-peer-probes-ci, wt-peer-probes-browser-tests]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.npmjs_publish && (inputs.package_selection == 'all' || inputs.package_selection == 'probes' || inputs.package_selection == 'wt-peer-probes')) }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/wt-peer-probes/package-lock.json
      - name: Install WebTransport peer probe dependencies
        working-directory: packages/wt-peer-probes
        run: npm ci --workspaces=false
      - name: Build WebTransport peer probe package
        working-directory: packages/wt-peer-probes
        run: npm run build --workspaces=false
      - name: Test WebTransport peer probe package
        working-directory: packages/wt-peer-probes
        run: npm test --workspaces=false
      - name: Publish WebTransport peer probe package to npm dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: packages/wt-peer-probes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
        run: npm publish --access public --provenance --dry-run
      - name: Publish WebTransport peer probe package to npm
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        working-directory: packages/wt-peer-probes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
        run: npm publish --access public --provenance

  publish-python-github-release:
    name: python-github-release
    needs: python-dist
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.gh_release && inputs.package_selection != 'probes' && inputs.package_selection != 'wt-peer-probes') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-dist-${{ github.sha }}
          path: dist
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets-${{ github.sha }}
          path: .artifacts/release-assets
      - name: Attach Python package and release evidence assets
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          files: |
            dist/*
            .artifacts/release-assets/*
          draft: false
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease }}

  deploy-release-pages:
    name: deploy-release-pages
    needs: python-dist
    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.pypi_publish || inputs.gh_release) && inputs.package_selection != 'probes' && inputs.package_selection != 'wt-peer-probes') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
