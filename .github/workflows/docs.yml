name: docs

on:
  push:
    branches:
      - master
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install workspace packages
        run: bash ./scripts/ci/install-workspace.sh
      - name: Generate release automation pages
        run: python tools/cert/release_auto.py
      - name: Package docs artifact
        run: |
          mkdir -p .artifacts/docs
          cp README.md .artifacts/docs/
          cp -R docs .artifacts/docs/docs
      - name: Upload docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-bundle
          path: .artifacts/docs
