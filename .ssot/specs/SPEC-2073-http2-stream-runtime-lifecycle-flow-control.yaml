body: |-
  Defines Tigrcorn HTTP/2 runtime ownership for stream identifiers, initiator rules, lifecycle transitions, reset handling, and connection-level plus stream-level flow control. Source specification: RFC 9113 https://www.rfc-editor.org/rfc/rfc9113. Runtime evidence for this spec applies to HTTP/2 only.
  
  ## Admission implementation extension (2026-11-18)
  
  Enforce stream caps and opening rates before HTTP/2 app dispatch; test rapid reset, continuation frames, half-close, reconnect across connections, and source/instance limits across workers.
  
  Related new contracts: spc:1009, spc:1010, spc:1011, spc:1012.
