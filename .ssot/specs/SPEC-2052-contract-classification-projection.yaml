body: |-
  # Contract classification projection
  
  Tigrcorn shall project runtime facts into the contract classification matrix without inventing alternate event names.
  
  Requirements:
  
  - Projection rows use `event + channel + scope_type + binding + family + exchange + direction`.
  - `event` is the canonical ASGI or tigr-asgi-contract event name.
  - `channel` is derived from whether Tigrcorn observed the event on ASGI `receive` or `send`.
  - `scope_type` remains one of `http`, `websocket`, `webtransport`, or `lifespan`.
  - `binding`, `family`, `exchange`, and `direction` are derived from scope metadata, selected protocol, event type, and payload discriminators.
  - Optional framing metadata may be projected only as subordinate row metadata.
  - Framing metadata must not change canonical event identity or create a required `subsurface` field.
  - WebTransport projection must distinguish session lifecycle, bidirectional stream, client-to-server unidirectional stream, server-to-client unidirectional stream, and datagram lanes.
  - The projection must fail closed when required metadata such as stream direction, stream id, selected subprotocol, ALPN, or capability flags is missing.
  
  Validation:
  
  - Tests must cover at least HTTP request/response, WebSocket connect/message/close, WebTransport connect, WebTransport bidi stream, both WebTransport unidi directions, WebTransport datagram, and lifespan events.
  - Tests must prove no required `subsurface` or duplicate event-name field is emitted.
  - Tests must prove optional framing metadata is preserved when known and omitted distinctly when unknown.
  - Client-session proof fields are governed by `spc:2053`; classification projection may use protocol-internal lane terms without exposing `lane` as a governed client-session field.
