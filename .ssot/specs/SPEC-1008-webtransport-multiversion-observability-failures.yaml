body: |-
  # Multi-version observability and failures

  Structured events shall record configured, advertised, peer, mutual, preferred, and selected profiles and codepoints. Inventory shall expose the immutable selected profile. Metrics shall use bounded profile and reason labels. Failures shall distinguish no overlap, missing capability, malformed setting, token mismatch, premature traffic, and buffering exhaustion. Rejected negotiation shall not create an application session.

  Defines: observability, inventory, metrics, and no-mutual-profile failure features.
