body: |-
  # Multi-version profile configuration

  When enabled, configuration shall provide a non-empty profile set and a preferred profile contained in that set. Concrete IDs and aliases shall resolve deterministically and deduplicate. `chromium` resolves to pinned `draft02`; `current` resolves to pinned `ietf-current`. CLI, environment, mapping, and Python APIs shall be equivalent.

  Defines: `feat:webtransport-profile-configuration` and `feat:webtransport-profile-alias-resolution`.
