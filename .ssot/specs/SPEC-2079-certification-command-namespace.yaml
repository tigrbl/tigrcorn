body: |-
  # Certification command namespace
  
  Tigrcorn shall define a narrow certification command namespace whose implementations live in `tigrcorn-certification`.
  
  Requirements:
  
  - The public CLI namespace shall be `tigrcorn certify <surface>`.
  - The umbrella package may dispatch `tigrcorn certify` subcommands.
  - Certification command implementations shall live in `tigrcorn-certification`.
  - Runtime, protocol, transport, security, static, observability, config, ASGI, HTTP, contract, compat, and core packages shall not import from `tigrcorn-certification`.
  - Certification commands shall consume public package-owned APIs, capability records, profile resolution, conformance fixtures, and evidence schemas.
  - Certification commands shall produce deterministic machine-readable output under an operator-provided output directory.
  - Certification commands shall report unavailable capabilities and invalid profiles as failures, not silent skips.
  - Initial command coverage shall include `tigrcorn certify static --mount <path> --profile <profile> --output <dir>`.
  - Additional surfaces may be added only when a surface-specific SPEC defines input, artifact, and acceptance behavior.
