body: |-
  Tigrcorn release certification shall generate deterministic and signed certification artifacts for identical inputs.
  
  Requirements:
  
  - Certification artifact families shall include protocol, runtime, security, performance, and interoperability evidence.
  - Artifact serialization shall be deterministic for identical inputs, environment descriptions, and evidence sets.
  - Replay and comparison tools shall identify meaningful evidence changes separately from timestamp or path noise.
  - Signing and provenance shall bind artifacts to the release, source snapshot, dependency state, and certification command inputs.
  - Promotion and publication gates shall distinguish unsigned draft evidence from signed release evidence.
