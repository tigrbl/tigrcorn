body: |-
  # IETF-current registered profile

  The IETF-current profile uses `SETTINGS_WT_ENABLED` at `0x2c7cf000`, CONNECT token `webtransport-h3`, H3 and QUIC DATAGRAM support, and `reset_stream_at`. It incorporates the existing current SETTINGS, CONNECT, and QUIC capability implementation without claiming Chromium compatibility.

