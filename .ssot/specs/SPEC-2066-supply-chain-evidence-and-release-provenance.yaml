body: |-
  Tigrcorn releases shall include supply-chain evidence and release provenance alongside certification artifacts.
  
  Requirements:
  
  - Release evidence shall include SPDX or CycloneDX SBOM output where the release rail can produce it.
  - Release evidence shall include SLSA provenance or an explicitly documented equivalent provenance artifact where available.
  - Package manifest integrity shall be checked across the Python and JavaScript package families before publication.
  - Dependency graph drift and version conflict risks shall be reported before release promotion.
  - Supply-chain evidence shall link to certification artifacts so operators can evaluate release correctness and artifact provenance together.
