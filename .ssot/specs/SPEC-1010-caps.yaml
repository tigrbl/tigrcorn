body: |-
  ## Requirements
  
  Apply connection caps per source and instance; session caps per connection, source, and
  instance; active-stream caps per connection, session where applicable, source, and instance.
  All relevant quotas must succeed before admission. Session and stream caps cannot bypass
  existing protocol negotiation or QUIC bidirectional/unidirectional credit. Maintain bounded
  request bodies, event queues, buffers, and reserved control capacity separately.
  
  Reject promptly by default; any enabled admission queue has finite length and deadline.
  Per-source identity is established by trusted transport/proxy policy, not arbitrary headers.
  Apply server-initiated stream capacity separately from client-opening rate accounting.
  
  ## Acceptance
  
  One extra stream at each scope is refused; more connections cannot evade source caps;
  multiple workers cannot multiply instance caps. Verify no application task starts for a
  transport-refused opening and reserved control streams cannot starve or grow unbounded.
  
  ## Delivery posture
  
  Implemented locally on 2026-11-18. The linked verification suite passed 90 tests with no skips; see `.ssot/evidence/admission-delivery/implementation.json` for source hashes, commands, and explicit unrelated baseline exclusions. Features are current/implemented with T2 targets. Release certification and published boundaries are unchanged.
  
  ## Governed feature mapping
  
  - `feat:client-session-pressure-modes`
  - `feat:transport-admission-refusal`
  - `feat:transport-connection-caps`
  - `feat:transport-instance-budget`
  - `feat:transport-session-caps`
  - `feat:transport-stream-caps`
  - `feat:webtransport-max-sessions-flag`
  - `feat:webtransport-max-streams-flag`
  
  ## Companion repository
  
  See https://github.com/tigrbl/tigrbl/tree/master/.ssot for the companion admission records. Cross-repository IDs are repository-qualified and must not be inserted as local registry edges.
  ## Implementation details
  
  Instance coordination uses atomic SQLite transactions shared by all workers, with opaque owner generations and confirmed-death reclamation. Source identity is the socket peer and stays bound across QUIC migration. `admission.max_tracking_entries` (CLI `--max-tracking-entries`, environment `TIGRCORN_MAX_TRACKING_ENTRIES`, Python field of the same name) defaults to 65536 and bounds bucket keys and QUIC stream history. Internal coordinator paths/owner generations are not public CLI options. See `docs/architecture/admission.md`.
