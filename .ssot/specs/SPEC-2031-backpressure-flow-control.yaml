body: |-
  # Backpressure and flow-control mapping
  
  Tigrcorn shall map backpressure and flow-control behavior into contract completion and family semantics.
  
  Requirements:
  
  - Native streams expose flow-control state where supported.
  - Emission APIs report completion levels that match the actual carrier guarantee.
  - ASGI/3 compatibility exposes additional flow-control metadata only through extensions.
  - Tests cover stalled consumers, closed streams, buffered sends, and transport handoff.
  - For request-streaming carriers, receive-side transport credit and application-visible backlog shall be tracked separately.
  - HTTP/2 request-body `WINDOW_UPDATE` behavior shall be tied to drained application-visible backlog or explicit backlog release, not only to bytes accepted from the socket.
  - Flow-control replenishment shall remain bounded at both the stream and connection level so a slow consumer on one stream cannot turn multiplexing into unbounded buffering.
  - WebTransport over HTTP/2 shall model TCP, HTTP/2 connection, HTTP/2 stream, WebTransport session, and WebTransport stream flow-control layers separately.
  - WebTransport over HTTP/2 shall implement and test WebTransport flow-control capsules before claiming stream/datagram backpressure support.
  - WebTransport over HTTP/3 shall distinguish QUIC transport flow control from WebTransport session and stream limits negotiated by draft-13 settings and capsules.
  - WebTransport resource governance shall connect configured budgets to carrier flow-control behavior without treating local limits as a substitute for negotiated wire semantics.
  - Congestion control shall represent aggregate network-path capacity; it shall not be used as a synonym for QUIC connection/stream flow control, scheduler eligibility, pacing, application backlog, or media encoder rate control.
  - A provider's congestion window and send-time result shall be combined with transport flow-control, anti-amplification, FIFO, and application-backpressure limits; it shall never override them.
