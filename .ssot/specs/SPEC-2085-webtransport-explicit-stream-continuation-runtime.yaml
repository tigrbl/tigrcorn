body: |-
  Tigrcorn preserves a WebTransport child stream while ASGI stream sends declare more=true and emits QUIC FIN only for more=false or an explicit stream-close event. Missing continuation state is rejected rather than interpreted as terminal. Application framing and operation completion do not influence carrier lifetime. Stream ownership, flow control, emit correlation, and cleanup remain session scoped.
