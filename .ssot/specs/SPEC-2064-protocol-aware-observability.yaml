body: |-
  Tigrcorn observability shall include protocol and transport intelligence beyond request, error, and latency metrics.
  
  Requirements:
  
  - Telemetry shall expose safe protocol, transport, TLS version, ALPN, listener, and profile dimensions.
  - QUIC and HTTP/3 telemetry shall expose safe RTT, loss, migration, retry, and connection/session identity dimensions where available.
  - WebSocket and WebTransport telemetry shall expose safe lifecycle, stream, datagram, and close dimensions where available.
  - OpenTelemetry traces, metrics, and logs shall preserve propagation, correlation, and trace-context behavior where enabled.
  - Redaction rules shall forbid secret, private key, token, and unsafe certificate material in logs, metrics, traces, and evidence.
  - QUIC telemetry shall report bounded provider identity plus congestion window, bytes in flight, pacing rate, delivery-rate estimate, recovery mode, and ECN response where available.
  - Algorithm-specific diagnostics shall be namespaced and redacted; raw options, connection ids, and path addresses shall not become unbounded metric labels.
