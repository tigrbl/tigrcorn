body: |-
  Tigrcorn shall certify entity tag, conditional request, range, and content-coding behavior as explicit HTTP delivery surfaces.
  
  Requirements:
  
  - Entity-tag certification shall cover weak validators, strong validators, conditional requests, and not-modified behavior.
  - Range certification shall cover valid ranges, malformed ranges, overlapping ranges, unsatisfiable ranges, and range amplification controls.
  - Content-coding certification shall cover allowlist policy, identity-only policy, strict policy, malformed compressed streams, and decompression amplification controls.
  - Compression side-channel posture shall be documented for configured content-coding behavior.
  - Static delivery and dynamic response paths shall declare whether they use the same certification evidence or separate evidence.
