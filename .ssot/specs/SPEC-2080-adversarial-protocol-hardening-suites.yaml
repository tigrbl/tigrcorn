body: |-
  # Adversarial protocol hardening suites
  
  Tigrcorn shall assign adversarial protocol hardening tests to the package that owns the behavior and shall use certification only to preserve evidence.
  
  Requirements:
  
  - HTTP/1.1 hardening shall live under `tigrcorn-protocols` HTTP/1 modules and cover slowloris, malformed chunking, request-smuggling variants, oversized headers, ambiguous connection headers, and premature EOF.
  - HTTP/2 hardening shall live under `tigrcorn-protocols` HTTP/2 modules and cover rapid reset, continuation flood, stream exhaustion, SETTINGS churn, flow-control deadlock, invalid pseudo-header ordering, and h2c boundary behavior.
  - HTTP/3/QUIC hardening shall split transport mechanics into `tigrcorn-transports` and HTTP/3/QPACK semantics into `tigrcorn-protocols`, covering deterministic packet loss, burst loss, reordering, duplication, controlled delay, reliable STREAM recovery, DATAGRAM abandonment, amplification limits, connection migration, CID rotation, 0-RTT rejection, stateless reset, QPACK blocked-stream pressure, and idle timeout enforcement.
  - WebSocket hardening shall live under `tigrcorn-protocols` WebSocket modules and cover fragmented control frames, masked/unmasked frame validation, close-handshake races, permessage-deflate bombs, long-lived idle connections, and slow-consumer backpressure.
  - WebTransport hardening shall live under `tigrcorn-protocols` WebTransport/H3 modules and cover stream/datagram buffering, session and stream flow control, reset/stop-sending mapping, GOAWAY/drain behavior, and resource governance.
  - Static hardening shall live under `tigrcorn-static` for behavior and `tigrcorn-certification` for artifact preservation, covering traversal, symlink/hardlink escape, range amplification, sidecar mismatch, content-type ambiguity, and inode mutation during response.
  - Observability expectations for hardening suites shall use `tigrcorn-observability` metric/log/trace schemas and stable event names.
  - Certification suites shall consume package-owned tests and evidence outputs without becoming an implementation dependency of runtime, protocol, transport, security, static, or observability packages.
  - This SPEC shall not expand into additional transport-security protocols, priority scheduling, broad cache/freshness claims, gateway integrity/signature products, or general gateway products outside existing carrier boundaries.
