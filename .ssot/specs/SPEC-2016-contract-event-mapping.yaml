body: |-
  # Contract event mapping
  
  Tigrcorn shall define event mapping between runtime traffic, canonical contract events, and ASGI/3 compatibility events.
  
  Requirements:
  
  - ASGI/3 HTTP, WebSocket, and lifespan events map into contract event records using canonical event names.
  - Contract events with standard ASGI/3 equivalents map back to standard ASGI/3 events.
  - Contract events without standard ASGI/3 equivalents require documented extension events or rejection.
  - Tigrcorn maps each event through `event + channel + scope_type + binding + family + exchange + direction` classification metadata.
  - `channel` records whether the event traversed ASGI `receive` or `send`; peer-flow `direction` remains separate semantic metadata.
  - Tigrcorn preserves selected framing, selected WebSocket subprotocol, and WebTransport lane framing hints when they are available as metadata.
  - Preserved framing metadata does not make Tigrcorn responsible for REST, JSON-RPC, NDJSON, or WebTransport inner app payload interpretation unless a separate Tigrcorn runtime contract explicitly says so.
  - Tigrcorn must not emit a required `subsurface` or duplicate event-name field merely to restate the selected lane.
  - Illegal event order and illegal event type combinations fail validation.
