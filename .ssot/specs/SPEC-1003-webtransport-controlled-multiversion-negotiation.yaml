body: |-
  # Controlled multi-version negotiation

  The server shall advertise all configured profile codepoints, receive peer SETTINGS, compute the mutual set, select the preferred mutual profile, and freeze that selection per connection. CONNECT, streams, and datagrams shall be gated until selection. No-overlap and malformed negotiation shall fail closed.

  Defines: advertisement, intersection, selection, gating, dispatch, routing, and no-mutual-profile features.
