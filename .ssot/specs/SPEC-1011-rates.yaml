body: |-
  ## Requirements
  
  Token buckets use monotonic time, positive finite rates, and integer bursts >= 1. Connection
  attempt rates apply per source and instance; session rates per connection/source/instance;
  stream rates per connection/session/source/instance where applicable. Count new-opening
  attempts, not data frames or retransmissions. At rate exhaustion do bounded work and
  protocol-correct refusal. Reset/close never refunds a token. Per-source buckets survive
  connection replacement for their outstanding refill interval.
  
  Bound bucket cardinality, expired-key cleanup work, and abuse-response volume. If source
  tracking capacity is full, refuse or use a bounded conservative overflow policy; never
  silently grant unmetered admission. Bound retained closed-stream history and use constant
  time active accounting rather than rescanning an ever-growing stream dictionary.
  
  ## Acceptance
  
  Deterministic clock tests cover refill, burst, clock behavior, and concurrency. Live tests
  cover rapid reset, reconnect churn, many sources, malformed attempts, continuation frames,
  and protocol control traffic. Prove rate budgets remain consumed after capacity refusal
  or downstream app rejection, with no false double-charge for retransmitted events.
  
  ## Delivery posture
  
  Implemented locally on 2026-11-18. The linked verification suite passed 90 tests with no skips; see `.ssot/evidence/admission-delivery/implementation.json` for source hashes, commands, and explicit unrelated baseline exclusions. Features are current/implemented with T2 targets. Release certification and published boundaries are unchanged.
  
  ## Governed feature mapping
  
  - `feat:client-session-pressure-modes`
  - `feat:transport-churn-defense`
  - `feat:transport-instance-budget`
  - `feat:transport-open-rates`
  - `feat:transport-source-identity`
  
  ## Companion repository
  
  See https://github.com/tigrbl/tigrbl/tree/master/.ssot for the companion admission records. Cross-repository IDs are repository-qualified and must not be inserted as local registry edges.
  ## Implementation details
  
  Instance coordination uses atomic SQLite transactions shared by all workers, with opaque owner generations and confirmed-death reclamation. Source identity is the socket peer and stays bound across QUIC migration. `admission.max_tracking_entries` (CLI `--max-tracking-entries`, environment `TIGRCORN_MAX_TRACKING_ENTRIES`, Python field of the same name) defaults to 65536 and bounds bucket keys and QUIC stream history. Internal coordinator paths/owner generations are not public CLI options. See `docs/architecture/admission.md`.
