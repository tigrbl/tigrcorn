body: |-
  Defines Tigrcorn's live WebTransport proof obligations for repeated and concurrent sessions on one listener across H3 native and H2 capsule-backed carriers.

  Requirements:

  - Live session identity shall remain stable for session create, accept, stream dispatch, datagram dispatch, close, drain, and cleanup.
  - H3 WebTransport traces shall include draft-13 settings negotiation, extended CONNECT response, stream/datagram ownership, buffering, GOAWAY effects, close/drain, and error-code mapping where applicable.
  - H2 WebTransport traces shall include settings negotiation, extended CONNECT response, capsule parsing, session-scoped stream/datagram ownership, flow-control capsule effects, close/drain, and malformed capsule rejection.
  - Carrier metadata shall distinguish H3/QUIC native stream/datagram backing from H2 capsule backing in evidence.
  - Global diagnostics inventory for WebTransport session records is governed by `spc:2081`; this SPEC remains the WebTransport-specific live identity and trace contract.
