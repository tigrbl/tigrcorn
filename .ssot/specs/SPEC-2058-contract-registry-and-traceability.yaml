body: |-
  Tigrcorn shall maintain contract registry records and a traceability chain from RFC or specification requirement to contract, implementation, tests, claims, and evidence.
  
  Requirements:
  
  - Contract records shall include contract id, version, owning package, status, stability level, certification state, deprecation state, and evidence links.
  - Stability levels shall be experimental, preview, stable, certified, and deprecated.
  - Certification state shall be represented separately from implementation availability.
  - RFC and specification requirements shall link to governed SPEC records, contract records, feature rows, test rows, claim rows, and evidence rows.
  - Partial, provisional, external, and unsupported evidence shall be represented explicitly.
  - Release certification shall fail closed when required traceability links are absent for a certified surface.
