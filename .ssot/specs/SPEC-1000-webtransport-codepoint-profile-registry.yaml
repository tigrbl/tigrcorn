body: |-
  # WebTransport profile registry

  The registry shall enforce unique profile IDs and setting codepoints. Each descriptor shall declare setting semantics, CONNECT contract, wire codec family, required H3 settings, required QUIC parameters, and lifecycle/error mappings. Incomplete or unverified descriptors shall not be advertised.

  Defines: `feat:webtransport-profile-registry`, `feat:webtransport-profile-startup-validation`, and all profile adapters.
