body: |-
  Tigrcorn static delivery shall have an explicit security certification boundary.
  
  Requirements:
  
  - Certification shall cover plain traversal, encoded traversal, Unicode traversal, and rejected normalization ambiguity.
  - Certification shall cover symlink escape prevention and configured directory boundary enforcement.
  - Certification shall cover cache poisoning controls, validator behavior, range interaction, and content-coding interaction.
  - Certification shall cover Alt-Svc interaction and Early Hints validation when those features are enabled with static delivery.
  - Static-origin profiles shall declare whether static delivery is disabled, enabled only when mounted, or enabled by explicit operator configuration.
