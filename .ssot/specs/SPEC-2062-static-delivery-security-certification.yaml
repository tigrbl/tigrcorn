body: |-
  # Static delivery security certification
  
  Tigrcorn static delivery shall have an explicit security certification boundary.
  
  Requirements:
  
  - Certification shall cover plain traversal, percent-encoded traversal, double-encoded traversal, Unicode normalization traversal, and rejected normalization ambiguity.
  - Certification shall cover symlink escape, hardlink escape where observable, mount-root ambiguity, directory-index ambiguity, case-folding ambiguity, and inode mutation during response.
  - Certification shall cover strong ETag, weak ETag, If-Match, If-None-Match, If-Modified-Since, If-Unmodified-Since, and HEAD versus GET consistency.
  - Certification shall cover invalid ranges, suffix ranges, overlapping ranges, multipart ranges, and range amplification limits.
  - Certification shall cover gzip sidecars, brotli sidecars, sidecar mismatch, content-length consistency, and decompression amplification controls.
  - Certification shall cover direct 103 Early Hints safe-header filtering and bounded Alt-Svc header-field advertisement.
  - Certification shall not claim HTTP/2 ALTSVC frames, broader Alt-Svc cache management, RFC 9111 caching/freshness, or RFC 9218 prioritization.
  - `tigrcorn-static` shall own reusable filesystem-origin checks, static response behavior, validator behavior, sidecar handling, and range response behavior.
  - `tigrcorn-certification` shall own the `tigrcorn certify static` command implementation, evidence bundle writing, artifact preservation, and certification report shape.
  - The umbrella `tigrcorn` CLI may dispatch `tigrcorn certify static --mount <path> --profile <profile> --output <dir>` to the certification package without making runtime, protocol, transport, security, or static packages depend on certification.
  - Static-origin profiles shall declare whether static delivery is disabled, enabled only when mounted, or enabled by explicit operator configuration.
