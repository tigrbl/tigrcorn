body: |-
  Tigrcorn runtime instances shall expose a stable describe contract for active event loop, listener, protocol, transport, TLS, deployment profile, worker, and observability state.
  
  Requirements:
  
  - Describe output shall identify the active runtime loop and whether it was selected explicitly, by profile, or by automatic fallback.
  - Describe output shall enumerate active listeners, their endpoint kinds, transport identities, local addresses, and externally safe peer metadata where available.
  - Describe output shall enumerate active protocol carriers, selected HTTP versions, WebSocket/WebTransport posture, TLS version, ALPN, and profile-derived policy state.
  - Describe output shall identify caller-owned, server-owned, borrowed, and transferred runtime resources without exposing secrets or private key material.
  - Describe output shall include observability exporter posture and redacted correlation identifiers where configured.
  - Describe output shall be distinct from capability export: capability export says what is supportable, while describe output says what is active now.
  - QUIC listener descriptions shall include the effective congestion-controller provider id, distribution and version, contract API version, selection source, and redacted validated options.
  - Runtime summaries may aggregate active connection counts by bounded provider id, but shall not expose per-connection identifiers as metric labels or disclose provider secrets.
