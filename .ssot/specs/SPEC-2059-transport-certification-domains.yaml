body: |-
  Tigrcorn shall certify TCP, UDP, Unix socket, pipe, in-process, listener, and QUIC transports as independent transport domains.
  
  Requirements:
  
  - Transport certification shall cover capability discovery, startup, shutdown, backpressure, latency, throughput, fairness, and resource usage.
  - Transport diagnostics shall expose endpoint identity, transport kind, carrier state, and safe operational counters.
  - QUIC transport diagnostics shall expose safe RTT, loss, migration, retry, and connection-id state where available.
  - Unsupported or unavailable transport capabilities shall fail closed during strict profile validation.
  - Transport evidence shall remain distinct from protocol handler evidence even when the same test scenario exercises both.
