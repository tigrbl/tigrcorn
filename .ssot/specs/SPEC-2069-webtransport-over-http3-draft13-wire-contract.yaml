body: |-
  # WebTransport over HTTP/3 draft-13 wire contract

  This SPEC defines Tigrcorn's canonical WebTransport over HTTP/3 and QUIC carrier contract for draft-ietf-webtrans-http3-13.

  Requirements:

  - The HTTP/3 carrier shall negotiate WebTransport support with `SETTINGS_WT_MAX_SESSIONS`; legacy `SETTING_ENABLE_WEBTRANSPORT` and `sec-webtransport-http3-draft` behavior is compatibility-only.
  - Session establishment shall use extended CONNECT with `:protocol = webtransport`, `:scheme = https`, `:authority`, `:path`, and applicable `Origin` validation.
  - The carrier shall implement draft-13 protocol negotiation headers `WT-Available-Protocols` and `WT-Protocol`.
  - Bidirectional WebTransport streams shall use the draft-13 stream signal/frame type and preserve session association before application data.
  - Unidirectional WebTransport streams shall use the draft-13 unidirectional stream type and preserve session association before application data.
  - QUIC DATAGRAM and HTTP/3 Datagram handling shall preserve WebTransport session association and configured datagram limits.
  - The carrier shall implement draft-13 stream reset, stop sending, application error, `RESET_STREAM_AT`, and buffered-stream rejection behavior where required by the draft.
  - The carrier shall implement draft-13 session close and drain capsules and the required flow-control capsules.
  - HTTP/3 GOAWAY behavior shall prevent new WebTransport sessions beyond the advertised limit while preserving established-session semantics.
  - Keying material exporter support shall be governed explicitly before certification claims mention exporter availability.
  - Runtime projection shall expose the same `webtransport.*` session, stream, datagram, and close events as other WebTransport carriers while preserving carrier metadata that identifies native HTTP/3 over QUIC backing.
  - Certification shall include positive and negative tests for settings negotiation, extended CONNECT admission, protocol negotiation headers, bidi streams, unidi streams, datagrams, buffering, GOAWAY, close/drain, flow-control capsules, error-code mapping, and legacy-draft rejection or compatibility behavior.
  - Runtime certification shall exercise the HTTP/3 and QUIC handler path, not only `tigrcorn.webtransport.wire` helper APIs.
  - Draft-13 settings negotiation shall include `SETTINGS_WT_MAX_SESSIONS`, `SETTINGS_WT_INITIAL_MAX_STREAMS_UNI`, `SETTINGS_WT_INITIAL_MAX_STREAMS_BIDI`, and `SETTINGS_WT_INITIAL_MAX_DATA` where applicable.
  - `WT-Available-Protocols` and `WT-Protocol` shall be emitted and validated by the live H3 WebTransport path before protocol-negotiation support is claimed.
  - Keying material exporter support shall call the QUIC/TLS exporter with the draft-13 WebTransport exporter context; deterministic helper hashing is not compliant runtime behavior.
  - `RESET_STREAM_AT`, `WT_SESSION_GONE`, `WT_BUFFERED_STREAM_REJECTED`, `WT_APPLICATION_ERROR`, GOAWAY, drain, and close-session behavior shall map to live QUIC/H3 errors and stream state transitions.
  - H3 draft-13 carrier compliance shall link to the WebTransport runtime conformance matrix in `spc:2071`.
