summary: "Defines Tigrcorn HTTP/1.1 runtime behavior for incremental request bodies, streaming response bodies, disconnects, trailers where supported, body limits, and connection or message backpressure. Source specification: RFC 9112 https://www.rfc-editor.org/rfc/rfc9112. The runtime must not expose native h11 stream IDs or multiplexed stream lanes."
