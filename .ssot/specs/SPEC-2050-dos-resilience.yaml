body: |-
  ## Content
  
  # DoS resilience and availability abuse contract
  
  Tigrcorn treats DoS warnings as runtime indications that resource exhaustion or protocol misuse can degrade service availability.
  
  ## Required behavior
  
  - HTTP/3 request parse buffers must have an explicit bounded ceiling and fail closed with H3_EXCESSIVE_LOAD when exceeded.
  - Cancellation paths used by shutdown and teardown must have a bounded helper so cancellation-resistant tasks cannot block closure indefinitely.
  - DoS warning signals must use a stable event name and structured attributes for surface, reason, action, resource, limit, and observed value.
  - Queue saturation, protocol stalls, stream-credit exhaustion, forced aborts, and shutdown timeout handling must remain testable as availability-abuse evidence.
  
  ## Boundary
  
  This contract governs package-owned runtime posture. It does not replace external network rate limiting, L4/L7 firewalling, or application-owned expensive-endpoint policy.
