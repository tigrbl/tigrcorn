body: |-
  # Runtime capability registry

  Tigrcorn shall expose a canonical machine-readable capability registry for protocol, transport, TLS, lifecycle, embedded runtime, observability, and certification support claims.

  Requirements:

  - Capability records shall distinguish compiled, configured, enabled, certified, unavailable, and unsupported states.
  - Capability records shall be deterministic JSON with schema version, registry name, profile, profile validation status, profile errors, and sorted capability records.
  - Capability ids shall remain stable and use domain-prefixed names such as `protocol.http3`, `transport.quic`, `tls.tls13`, `delivery.static`, and `certification.release_validation`.
  - Protocol capability records shall cover HTTP/1.1, HTTP/2, HTTP/3, WebSocket, WebTransport, QUIC, and lifespan behavior.
  - Transport capability records shall cover TCP, UDP, Unix socket, pipe, in-process, listener, and QUIC transports.
  - TLS and identity capability records shall cover TLS 1.3, ALPN, X.509 validation, OCSP, CRL handling, and mTLS where configured.
  - Runtime capability records shall identify supported lifecycle, embedded-server, loop, worker, and observability surfaces.
  - Certification tooling and deployment profiles shall consume capability records rather than parsing README, package metadata, or release-note prose.
  - Public CLI and Python APIs shall return deterministic structured output suitable for profile validation and release evidence.
  - Tigrcorn shall support `from tigrcorn import capabilities` with `capabilities.export()`, `capabilities.capability_ids()`, and `capabilities.require_supported()` as the public Python capability-registry surface.
  - Tigrcorn shall support `tigrcorn inspect capabilities --json --profile <profile>` as the public operator capability export command.
  - Tigrcorn capability inspection may accept repeatable `--require <capability-id>` checks that fail closed when a selected profile does not enable the required capability.
  - Runtime instance `.describe()` output shall reference capability ids rather than inventing a parallel support vocabulary.
  - Runtime connection inventory describes live peer, connection, and protocol-session instances and is governed separately by `spc:2081`. It shall not be treated as a capability registry, and capability records shall not be inferred from live connection records.
  - Transport capability discovery shall align with the same capability id vocabulary.
