summary: "This SPEC defines tigrcorn projection and enforcement for contract channel_lifecycle states. It maps HTTP/2 RFC 9113 half-closed remote and local, RST_STREAM, GOAWAY, and flow-control exhaustion; HTTP/3 RFC 9114 request cancellation, rejection, GOAWAY, and stream errors; QUIC RFC 9000 send and receive stream states, RESET_STREAM, STOP_SENDING, connection close, draining, and idle timeout; and WebSocket tunnel lifecycle from RFC 8441 and RFC 9220 when applicable. It requires writes to be blocked after write_closed, inbound waits to stop after read_closed, new sends to be suppressed during closing, and failed or lost states to project into disconnect and cancellation observations when applicable."
