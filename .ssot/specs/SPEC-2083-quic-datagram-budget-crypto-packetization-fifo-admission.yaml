body: |-
  # QUIC datagram budget and ordered emission contract

  ## Requirements

  1. The HTTP/3 listener shall propagate its configured maximum UDP payload to each `QuicConnection` and per-path recovery context.
  2. The configured value shall be described as a ceiling, not as discovered PMTU evidence.
  3. Every emitted UDP datagram shall be no larger than the effective send budget.
  4. CRYPTO frames shall use contiguous, non-overlapping offsets and retain their original encryption level during initial transmission and retransmission.
  5. Multi-datagram flights shall preserve wire order across receive batches and deferred-send queues.
  6. Congestion, pacing, and anti-amplification admission shall stop at the first blocked datagram. Later datagrams shall not bypass it.
  7. Send and recovery accounting shall be confirmed only after socket emission is accepted.
  8. ACK processing may release congestion or pacing capacity without changing FIFO order.
  9. Tests shall cover exact-fit, one-byte-over, minimum-size, loss, reorder, duplicate ACK, multi-packet flight, and PTO cases.
  10. QUIC packet budget, QUIC DATAGRAM frame payload budget, and WebTransport application payload budget shall remain separately represented.
  11. A congestion-controller provider may restrict admission and propose pacing time, but it shall not reorder queued datagrams, encode packets, confirm socket emission, or bypass anti-amplification and flow-control limits.
  12. Every supported provider shall pass the same FIFO, exact-fit, blocked-head, ACK-release, loss, and PTO admission matrix.

  ## Evidence boundary

  Configured-size enforcement and final encoded-length checks are local conformance evidence. PMTU discovery, DPLPMTUD, and independent peer interoperability require separate evidence.
