body: |-
  # Chromium draft-02 profile

  The draft-02 profile uses setting `0x2b603742`, boolean value `1`, CONNECT token `webtransport`, Chromium's draft-02 request marker, draft-02 stream/datagram formats, and QUIC DATAGRAM support. It does not require `reset_stream_at`. Independent Chromium evidence is required for compatibility claims.

  Defines: `feat:webtransport-draft02-profile` and `feat:webtransport-draft02-chromium-interop`.
