references: []
body: |-
  Decision: Tigrcorn owns RFC 8441 WebSocket-over-HTTP/2 runtime behavior as one WebSocket session carried by one Extended CONNECT HTTP/2 stream.
  
  Owned boundary:
  - Tigrcorn owns Extended CONNECT negotiation, WebSocket framing after establishment, stream closure mapping, backpressure, and evidence for this runtime stack.
  
  Peer inputs:
  - tigr-asgi-contracts owns the WebSocket contract vocabulary.
  - Tigrbl owns binding projection.
  
  Forbidden claims:
  - RFC 8441 runtime evidence must not be used as WebTransport support.
  - WebSocket-over-H2 must not become generic H2 bidirectional app-stream support.
