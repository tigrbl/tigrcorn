body: |-
  ## Decision
  
  One scheduler-owned admission controller shall enforce connection, protocol-session,
  and transport-stream capacity before expensive allocation or application dispatch.
  Carrier code supplies lifecycle facts and performs protocol-correct refusal; it does
  not embed independent quota algorithms. All configured parent budgets must admit a
  resource atomically, with rollback on partial failure. Count client and server initiated
  streams against explicit resource budgets; client opening-rate limits count client attempts.
  
  
  ## Resource taxonomy and ownership
  
  - A connection is a TCP/Unix transport association or a QUIC connection. QUIC migration
    does not create a new connection budget. HTTP/1.1 keep-alive reuse does not create one.
  - HTTP/2 streams and HTTP/3 request/QUIC streams have transport-owned identities.
    HTTP/1.1 message-body lifetimes are separately classified; do not invent QUIC-style IDs.
  - A protocol session is a WebSocket or WebTransport interaction, not an authentication
    or database session. WebSocket H2/H3 sessions occupy an underlying CONNECT stream;
    WebTransport has a CONNECT session plus child streams. Account resource classes
    separately; no duplicate reservation of the same resource within one class.
  - Application subscriptions are Tigrbl-owned logical resources, possibly many per
    session/control stream. Tigrcorn does not infer subscriptions from frame/message counts.
  - Source identity defaults to the socket peer's canonical address, without ephemeral
    port. Forwarded identity requires an explicit trusted-proxy contract. QUIC identity
    remains stable across migration; any source-key transition is atomic and cannot reset
    existing budgets. IP quotas are coarse abuse controls, not authenticated account quotas.
  
  
  ## Rationale and alternatives
  
  Per-connection protocol limits alone permit aggregate exhaustion across connections.
  Application middleware runs too late to protect parsing and transport state. A single
  generic task semaphore cannot express sessions, streams, or application subscriptions.
  Keep independent byte/backlog caps, flow control, congestion control, and pacing.
  
  ## Cooperation
  
  Tigrbl owns authenticated admission and logical subscriptions. Native contract events and
  optional versioned ASGI extensions expose stable identities, terminal reasons, and effective
  transport policy; applications never release Tigrcorn's internal leases. Existing standard
  ASGI applications require no extension to receive base transport protection.
  
  ## Consequences
  
  HTTP/2 and HTTP/3 protocol caps compose with the controller; the tightest applicable cap
  wins. Required control/QPACK infrastructure has separate bounded reservations and does
  not consume ordinary application-stream slots. Protected control capacity must itself
  remain finite. Policies and source maps have bounded cardinality.
  
  ## Delivery posture
  
  Implemented locally on 2026-11-18. The linked verification suite passed 90 tests with no skips; see `.ssot/evidence/admission-delivery/implementation.json` for source hashes, commands, and explicit unrelated baseline exclusions. Features are current/implemented with T2 targets. Release certification and published boundaries are unchanged.
  
