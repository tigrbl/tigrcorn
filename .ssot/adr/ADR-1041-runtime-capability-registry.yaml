body: |-
  Tigrcorn shall expose a machine-readable capability registry for protocol, transport, TLS, lifecycle, embedded runtime, observability, and certification surfaces.
  
  Capability records must distinguish compiled, configured, enabled, certified, unavailable, and explicitly unsupported states. Package descriptions, README claims, profile defaults, and release notes may describe capabilities, but they must not be the authoritative runtime support source.
  
  Consequences:
  
  - Deployment profiles can validate required capabilities before serving traffic.
  - Certification tooling can compare claimed support against current runtime evidence.
  - Compatibility checks can fail closed when a protocol, transport, TLS, or lifecycle capability is absent or uncertified.
  - Public support claims become auditable against a stable machine-readable surface.
