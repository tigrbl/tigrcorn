body: |-
  Decision: Tigrcorn owns WebTransport-over-HTTP/2 as a draft fallback runtime carrier with capsule constraints and no QUIC-native stream identity claims.
  
  Owned boundary:
  - Tigrcorn owns HTTP/2 Extended CONNECT and capsule-carrier behavior for WebTransport-over-H2 when enabled.
  - Tigrcorn must keep H2 fallback maturity and evidence separate from H3 WebTransport evidence.
  
  Peer inputs:
  - tigr-asgi-contracts owns contract vocabulary.
  - Tigrbl owns capability-gated binding projection.
  
  Forbidden claims:
  - WebTransport-over-H2 must not claim QUIC datagram semantics.
  - WebTransport-over-H2 must not claim QUIC stream-ID bit encoding.
