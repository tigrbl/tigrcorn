body: |-
  ## Decision
  
  Use monotonic-clock token buckets for client connection, session, and stream opening
  attempts, independently of active-resource leases. Apply sustained rates and bursts at
  connection/session scopes where applicable, per source across connections, and per instance.
  Charge a recognizable new-opening attempt before expensive allocation. An admitted
  opening consumes each applicable token even if later authentication, capacity admission,
  or application work fails. Retransmissions, header continuations, data frames, and duplicate
  lifecycle callbacks are not new openings. A rejected attempt does not extend its own lease.
  
  Closing/resetting releases active capacity but never refunds opening-rate tokens. Reconnect
  cannot reset per-source or aggregate buckets. Apply a bounded malformed/control-frame
  abuse policy before a valid opening can be identified; an opening limiter alone is not
  complete parser protection. Saturated traffic receives bounded processing and responses.
  
  ## Rationale
  
  Active caps alone do not constrain rapid open/reset churn. Network pacing and receive
  credit measure bytes, not client-created work. Bound bucket maps and closed-stream
  history so accounting does not become an exhaustion vector. Never evict an active lease
  or a bucket with outstanding token debt merely to accept an untracked new source.
  
  ## Consequences
  
  Expose separate counters for attempts, rate refusals, capacity refusals, reset churn, and
  successful admission without unbounded source-ID metric labels. A global bucket protects
  the server from aggregate churn by many sources.
  
  ## Delivery posture
  
  Implemented locally on 2026-11-18. The linked verification suite passed 90 tests with no skips; see `.ssot/evidence/admission-delivery/implementation.json` for source hashes, commands, and explicit unrelated baseline exclusions. Features are current/implemented with T2 targets. Release certification and published boundaries are unchanged.
  
