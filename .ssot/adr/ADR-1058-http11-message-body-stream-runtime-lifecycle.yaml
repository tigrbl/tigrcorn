body: |-
  Decision: Tigrcorn owns HTTP/1.1 streaming as request and response message body lifecycle behavior, not as native multiplexed transport stream behavior.
  
  Owned boundary:
  - Tigrcorn owns HTTP/1.1 parser/runtime behavior for incremental request bodies, streaming response bodies, disconnects, trailers where supported, body-size limits, and connection/message-level backpressure.
  - Tigrcorn may expose protocol-local lifecycle facts to the contract adapter without inventing HTTP/1.1 stream IDs.
  - Tigrcorn owns runtime evidence for HTTP/1.1 streaming claims.
  
  Peer inputs:
  - tigr-asgi-contracts owns the HTTP scope and event vocabulary.
  - Tigrbl owns app binding projection onto HTTP request and response body streams.
  
  Non-goals:
  - This ADR does not define HTTP/2 or HTTP/3 stream ID rules.
  - This ADR does not define WebSocket or WebTransport stream/session behavior.
  - This ADR does not define Tigrbl table binding policy.
  
  Forbidden claims:
  - Tigrcorn must not represent HTTP/1.1 body streaming as native bidirectional or unidirectional transport streams.
  - Tigrcorn must not claim HTTP/2, HTTP/3, QUIC, or WebTransport stream identity from HTTP/1.1 runtime evidence.
