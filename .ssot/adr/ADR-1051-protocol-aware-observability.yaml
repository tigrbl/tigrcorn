body: |-
  Tigrcorn observability shall include protocol, transport, TLS, ALPN, RTT, loss, QUIC migration, and connection/session identity dimensions instead of only request, error, and latency metrics.
  
  OpenTelemetry traces, metrics, and logs must preserve propagation, correlation, and trace-context behavior where enabled. Observability output must respect redaction and avoid leaking secrets or private key material.
  
  Consequences:
  
  - Transport-aware runtime behavior can be diagnosed from telemetry.
  - Certification artifacts can include observability conformance evidence.
  - Operators can correlate protocol behavior with transport degradation.
  - Logging and telemetry standards remain aligned with runtime-owned metadata.
  - QUIC telemetry reports the selected controller identity, contract version, mode, congestion window, pacing rate, delivery-rate estimate, and ECN response where available.
  - Controller identity uses bounded provider identifiers; raw provider options and per-connection values must not become unbounded metric labels or leak secrets.
