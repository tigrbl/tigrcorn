body: |-
  Tigrcorn QUIC certification shall include operational security behavior in addition to nominal RFC conformance.
  
  Certification must cover amplification protection, retry token behavior, spoofed address handling, path validation, NAT rebinding, connection ID rotation, congestion control, and loss recovery evidence.
  
  Consequences:
  
  - QUIC support cannot be promoted solely because happy-path HTTP/3 traffic succeeds.
  - qlog, diagnostics, and negative tests become part of the certification path.
  - WebTransport and HTTP/3 profiles inherit a stronger QUIC security baseline.
  - Release evidence can distinguish protocol conformance from operational security certification.
