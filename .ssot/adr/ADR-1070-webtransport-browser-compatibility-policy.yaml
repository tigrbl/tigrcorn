body: |-
  ## Decision

  Browser compatibility is an explicit pinned alias, not a synonym for the current IETF draft. The `chromium` alias initially resolves to the verified draft-02 profile. Alias changes require an explicit compatibility revision and independent Chromium evidence. Same-stack tests cannot certify Chromium compatibility.

  ## Governed features

  - `feat:webtransport-profile-alias-resolution`
  - `feat:webtransport-draft02-profile`
  - `feat:webtransport-draft02-chromium-interop`
