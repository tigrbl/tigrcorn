body: |-
  # ADR 1017 - Contract event mapping
  
  Decision: Runtime event translation shall use `tigr-asgi-contract` events as the normative vocabulary.
  
  Standard ASGI3 receive and send events map into contract events for HTTP, WebSocket, and lifespan. Contract events with no ASGI equivalent must either use extension events, adapter metadata, or explicit rejection.
  
  Consequences:
  
  - Event legality is validated against the contract model.
  - Compatibility tests must prove both directions where the mapping is reversible.
  - Lossy translations must be visible in documentation and evidence.
  
  ## Classification update
  
  Tigrcorn shall map runtime traffic to canonical ASGI or contract event names plus channel metadata. The canonical classification row shape is `event + channel + scope_type + binding + family + exchange + direction`. Tigrcorn must not emit a separate required event-name field merely to restate a transport lane.
  
  ## Framing update
  
  Tigrcorn preserves selected framing and subprotocol metadata when it is available on the carrier or bridge boundary. Tigrcorn does not reinterpret application payload semantics for REST, JSON-RPC, NDJSON, or WebTransport inner app framing unless a separate Tigrcorn runtime contract explicitly says so.
