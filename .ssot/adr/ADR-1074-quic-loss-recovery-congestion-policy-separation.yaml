body: |-
  # Decision

  Tigrcorn shall separate RFC 9002 loss recovery from congestion-control policy.

  Tigrcorn owns packet-number spaces, sent-packet tracking, RTT estimation, ACK processing, loss detection, PTO, retransmission scheduling, anti-amplification, flow control, packet encoding, send confirmation, and wire ordering. A congestion-controller provider consumes normalized transport measurements and returns congestion-window and pacing-rate limits.

  The provider shall not receive UDP sockets, encoded datagrams, cryptographic state, stream buffers, or connection-closing authority. Provider output is advisory until Tigrcorn validates and enforces it. Invalid output or provider failure shall fail closed without permitting uncontrolled transmission.

  Controller state is scoped to one validated QUIC network path. A migrated path receives independent controller state. Tigrcorn may retain a connection-level view for diagnostics but shall not share mutable congestion state across connections or paths.

  # Consequences

  - RFC 9002 recovery remains stable independently of provider choice.
  - Congestion policy becomes replaceable without granting providers wire ownership.
  - The Tigrcorn pacer enforces provider-requested pacing within transport-owned safety limits.
  - Existing anti-amplification and FIFO admission rules remain authoritative.

  # Governed features

  - `feat:quic-cc-contract`
  - `feat:quic-cc-per-path-lifecycle`
  - `feat:quic-cc-pacer-integration`
