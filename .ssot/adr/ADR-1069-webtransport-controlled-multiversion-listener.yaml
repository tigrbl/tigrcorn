body: |-
  ## Decision

  A controlled multi-version HTTP/3 listener advertises every configured and fully implemented WebTransport setting codepoint. After peer SETTINGS arrive, Tigrcorn computes the mutual profile set and selects exactly one preferred mutual profile for the connection. Selection is immutable. CONNECT requests and native streams are not processed before selection. No mutual profile fails deterministically without starting an application session.

  ## Governed features

  - `feat:webtransport-multiversion-settings-advertisement`
  - `feat:webtransport-peer-profile-intersection`
  - `feat:webtransport-connection-profile-selection`
  - `feat:webtransport-negotiation-gating`
  - `feat:webtransport-profile-aware-connect-dispatch`
  - `feat:webtransport-no-mutual-profile-failure`
