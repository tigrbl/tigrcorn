body: |-
  Decision: Tigrcorn owns HTTP/3 runtime stream taxonomy over QUIC, including request, push, control, QPACK, reset, GOAWAY, and transport lifecycle behavior.
  
  Owned boundary:
  - Tigrcorn owns QUIC stream initiator and direction handling where it affects HTTP/3 runtime behavior.
  - Tigrcorn owns HTTP/3 runtime evidence and certification boundaries.
  
  Peer inputs:
  - tigr-asgi-contracts owns projected contract vocabulary.
  - Tigrbl owns binding legality above runtime capabilities.
  
  Forbidden claims:
  - Tigrcorn must not treat WebTransport lanes as plain HTTP/3 app streams.
  - Tigrcorn must not use WebSocket-over-H3 evidence to claim generic WebTransport behavior.
