body: |-
  ## Decision
  Tigrcorn shall certify WebTransport over HTTP/3 draft-13 as its own carrier compliance domain, separate from legacy draft02 compatibility and helper-only wire modeling.

  ## Consequences
  - HTTP/3 draft-13 compliance requires runtime-level carrier behavior, not helper-only packet or capsule modeling.
  - Runtime certification must prove stream, session, SETTINGS, capsule, datagram, and lifecycle behavior through Tigrcorn surfaces.
  - Legacy draft02 and HTTP/2 fallback evidence does not satisfy this draft-13 carrier target.
