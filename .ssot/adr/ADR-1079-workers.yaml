body: |-
  ## Decision
  
  Worker limits, server-instance limits, and deployment-wide limits are distinct scopes.
  The initial hard instance cap shall use a shared instance coordinator with atomic
  reservations, owner generation IDs, and worker-death reconciliation. Worker-local fallback
  must never multiply or silently weaken an instance limit. Static allocations are allowed
  only when their sum and reassignment protocol preserve the same hard cap.
  
  Transport leases end only when resources are actually closed. A time-to-live alone must
  not reclaim a still-live stream and allow oversubscription: an unfenced worker cannot
  continue serving after its ownership has been revoked. Coordinator loss refuses new
  admissions; existing work may drain within existing ownership. Startup rejects a topology
  that cannot provide the requested scope. Source budgets and aggregate rate tokens share
  the same instance authority across workers, including workers on different event loops.
  
  ## Rationale and boundaries
  
  One counter per worker is insufficient for an advertised server cap. Cluster-wide
  transport coordination is a separately selected optional store, not implied by an instance
  cap. Tigrbl may independently coordinate authenticated subscriptions across replicas.
  
  ## Acceptance
  
  Concurrent admissions never exceed the configured sum; worker crash, reload, coordinator
  loss, delayed release, and owner-generation reuse cannot leak or duplicate capacity.
  
  ## Delivery posture
  
  Implemented locally on 2026-11-18. The linked verification suite passed 90 tests with no skips; see `.ssot/evidence/admission-delivery/implementation.json` for source hashes, commands, and explicit unrelated baseline exclusions. Features are current/implemented with T2 targets. Release certification and published boundaries are unchanged.
  
