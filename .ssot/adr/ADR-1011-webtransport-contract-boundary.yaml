body: |-
  # ADR 1011 - WebTransport contract boundary
  
  Decision: Tigrcorn shall implement first-class WebTransport over HTTP/3 and QUIC as an in-bound product target.
  
  The authoritative product boundary is the `.ssot` registry. Human-readable docs are projections and do not win conflicts with `.ssot/registry.json`.
  
  WebTransport is in bounds because it is a transport/protocol/application-hosting target that sits directly on the package-owned QUIC and HTTP/3 stack.
  
  The boundary tracks the W3C WebTransport API model as the external API semantics reference and the IETF WEBTRANS HTTP/3 draft family as the carrier-protocol reference while those documents remain work in progress. MDN WebTransport documentation is tracked as an informative implementation and browser-behavior reference for developer-facing examples, terminology, and compatibility notes.
  
  REST and JSON-RPC are out of bounds for Tigrcorn's runtime. They are application or framework bindings above ASGI HTTP. Tigrcorn may validate contract metadata that classifies HTTP traffic, but it shall not implement REST or JSON-RPC product runtimes.
  
  ## Classification update
  
  WebTransport projection shall distinguish native lanes under one session: session lifecycle, bidirectional streams, client-to-server unidirectional streams, server-to-client unidirectional streams, and datagrams. Message-shaped application payloads may be inner framing on a stream or datagram, but `message` is not a peer native WebTransport transport lane.
  
  Tigrcorn owns WebTransport lane transport facts such as session identity, stream identity, stream direction, datagram capability, and close/error metadata. Application-level message framing inside a WebTransport stream or datagram remains a higher-layer concern unless separately governed in Tigrcorn.
