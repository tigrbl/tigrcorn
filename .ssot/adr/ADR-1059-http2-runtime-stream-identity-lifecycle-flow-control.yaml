body: |-
  Decision: Tigrcorn owns HTTP/2 stream IDs, lifecycle transitions, connection and stream flow control, and runtime evidence for RFC 9113 behavior.
  
  Owned boundary:
  - Tigrcorn owns HTTP/2 stream ID allocation and validation, initiator rules, half-close/reset behavior, HPACK-adjacent runtime integration, and flow-control window enforcement.
  - Tigrcorn owns runtime conformance and evidence for HTTP/2 stream behavior.
  
  Peer inputs:
  - tigr-asgi-contracts owns contract vocabulary and lifecycle projection.
  - Tigrbl owns app binding projection.
  
  Forbidden claims:
  - Tigrcorn must not use HTTP/2 evidence to claim HTTP/3, QUIC, or WebTransport semantics.
