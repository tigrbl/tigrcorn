body: |-
  Decision: Tigrcorn owns RFC 9220 WebSocket-over-HTTP/3 runtime behavior as one WebSocket session carried by one Extended CONNECT HTTP/3 stream.
  
  Owned boundary:
  - Tigrcorn owns Extended CONNECT negotiation, WebSocket framing after establishment, stream closure mapping, backpressure, and evidence for this runtime stack.
  
  Peer inputs:
  - tigr-asgi-contracts owns the WebSocket contract vocabulary.
  - Tigrbl owns binding projection.
  
  Forbidden claims:
  - RFC 9220 runtime evidence must not be used as WebTransport support.
  - WebSocket-over-H3 must remain separate from WebTransport-over-H3 even when served by the same listener.
