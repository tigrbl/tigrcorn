body: |-
  Tigrcorn owns QUIC, HTTP/3, and WebTransport connection/session lifecycle. Live downstream applications must receive stable transport-owned session identity and traces for packet receive, session create, handshake complete, CONNECT response, stream dispatch, datagram dispatch, close, and cleanup. Session, stream, and datagram ownership must remain keyed by actual QUIC/WebTransport runtime state, including sequential and concurrent sessions on one listener.
  
  H2 fallback and H3 draft-13 runtime traces are distinct carrier cases. HTTP/2 WebTransport session identity is the extended CONNECT stream id and stream/datagram ownership is capsule-backed. HTTP/3 draft-13 WebTransport session identity is tied to the CONNECT stream while data streams, QUIC DATAGRAM payloads, reset/stop events, GOAWAY/drain signals, and `WT_SESSION_GONE` cleanup must preserve carrier-specific ownership metadata.
  
  ## Admission implementation extension (2026-11-18)
  
  WebTransport session and child-stream identities key distinct transport leases. Disconnect, reset, cancellation, and shutdown report terminal events exactly once. The Tigrbl application independently cleans up subscription leases; transport session identity does not establish authenticated tenant identity.
  
  Governed by adr:1077, adr:1078, adr:1079; configuration contract spc:1014.
