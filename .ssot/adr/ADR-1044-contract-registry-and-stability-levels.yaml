body: |-
  Tigrcorn contracts shall be discoverable through a contract registry that records contract identity, version, owning package, stability level, certification state, deprecation state, and evidence links.
  
  Contract stability levels are experimental, preview, stable, certified, and deprecated. A contract may be implemented without being certified, and certification must be represented separately from implementation availability.
  
  Consequences:
  
  - Operators can identify which contracts are stable enough for a deployment profile.
  - Certification gates can require certified contracts for strict profiles.
  - Deprecation can be represented without deleting historical contract records.
  - Contract metadata becomes an auditable release artifact instead of README-only prose.
