body: |-
  ## Decision

  Each WebTransport HTTP/3 setting codepoint identifies exactly one immutable wire profile. A profile owns its setting semantics, CONNECT token and headers, stream and datagram formats, capsules, transport requirements, resets, closures, and errors. TLS ALPN remains `h3` and does not select the WebTransport profile.

  ## Governed features

  - `feat:webtransport-profile-registry`
  - `feat:webtransport-profile-startup-validation`
  - `feat:webtransport-profile-aware-wire-routing`
  - `feat:webtransport-draft02-profile`
  - `feat:webtransport-draft13-profile-adapter`
  - `feat:webtransport-ietf-current-profile-adapter`
