body: |-
  Tigrcorn release certification shall generate deterministic and signed protocol, runtime, security, performance, and interoperability evidence artifacts for identical inputs.
  
  Certification outputs must include stable artifact shapes for protocol, runtime, security, performance, and interoperability evidence. Signing and provenance may use Sigstore or equivalent governed mechanisms, but unsigned certification artifacts must not be treated as final release evidence for strict profiles.
  
  Consequences:
  
  - Release certification can be replayed and compared across environments.
  - Evidence tampering becomes detectable.
  - Promotion and publication gates can require signed certification artifacts.
  - Local evidence bundles remain derived artifacts, not replacement canonical source.
