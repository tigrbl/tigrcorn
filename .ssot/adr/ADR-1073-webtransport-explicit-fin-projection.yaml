tags: []
summary: "Tigrcorn projects explicit WebTransport stream continuation state onto QUIC. It does not infer stream termination from JSON, JSON-RPC, application-record completion, handler return, or operation completion. more=true preserves the sending direction; more=false or webtransport.stream.close emits terminal stream intent. Missing continuation state fails closed. Session and child-stream lifetimes remain independent."
