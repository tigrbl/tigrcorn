body: |-
  # ADR 1024 - Stream and datagram runtime
  
  Decision: Tigrcorn shall model streams and datagrams as first-class runtime families.
  
  Stream and datagram behavior is not only an implementation detail of QUIC. It must be visible in contract scopes, events, capabilities, flow control, and evidence.
  
  Consequences:
  
  - QUIC and WebTransport implementations share one family model.
  - ASGI3 compatibility must expose these families through extensions or reject them.
  - Backpressure and datagram loss semantics require dedicated tests.
  
  ## Classification update
  
  Stream and datagram runtime labels shall validate against the contract event classification matrix. A stream event must declare or derive whether it is bidirectional, client-to-server unidirectional, or server-to-client unidirectional before it can be classified as `duplex`, `client_stream`, or `server_stream`.

  Client-session coverage under ADR-1039 treats `stream_id` and `datagram_id` as governed proof identifiers but does not expose internal lane labels as client-session fields.
