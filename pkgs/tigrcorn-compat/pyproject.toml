[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigrcorn-compat"
version = "0.3.18.dev2"
description = "Compatibility and interoperability helpers for Tigrcorn ASGI3 conformance, external peers, and Python web server release gates."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Jacob Stewart", email = "jacob@swarmauri.com"}]
keywords = ["tigrcorn", "compatibility", "interop", "asgi3", "conformance", "release-gates", "python-web-server"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "tigrcorn-core==0.3.18.dev2",
  "tigrcorn-asgi==0.3.18.dev2",
  "tigrcorn-runtime==0.3.18.dev2",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.package-data]
tigrcorn_compat = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
