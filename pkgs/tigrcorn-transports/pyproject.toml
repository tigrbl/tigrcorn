[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigrcorn-transports"
version = "0.3.16.dev12"
description = "TCP, UDP, Unix socket, pipe, in-process, listener, and QUIC transport primitives for the Tigrcorn server stack."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Jacob Stewart", email = "jacob@swarmauri.com"}]
keywords = ["tigrcorn", "transports", "tcp", "udp", "unix-socket", "quic", "listeners", "python-networking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "tigrcorn-core==0.3.16.dev12",
  "tigrcorn-config==0.3.16.dev12",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.package-data]
tigrcorn_transports = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
