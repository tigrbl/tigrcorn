[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigrcorn-certification"
version = "0.3.16.dev10"
description = "Certification and release-gate tooling for Tigrcorn HTTP/3, QUIC, WebSocket, WebTransport, and ASGI conformance evidence."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Jacob Stewart", email = "jacob@swarmauri.com"}]
keywords = ["tigrcorn", "certification", "conformance", "interop", "release-gates", "http3", "quic", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "tigrcorn-compat==0.3.16.dev10",
  "tigrcorn-runtime==0.3.16.dev10",
  "tomli>=2.0.0; python_version < '3.11'",
  "cryptography>=46.0.0",
  "aioquic>=1.3.0",
  "h2>=4.1.0",
  "websockets>=12.0",
  "wsproto>=1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.package-data]
tigrcorn_certification = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
