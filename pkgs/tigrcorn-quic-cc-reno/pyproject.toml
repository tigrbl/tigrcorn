[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tigrcorn-quic-cc-reno"
version = "0.3.18.dev2"
description = "Default Reno congestion-controller provider for Tigrcorn QUIC transports."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Jacob Stewart", email = "jacob@swarmauri.com"}]
dependencies = ["tigrcorn-quic-cc==0.3.18.dev2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
keywords = ["tigrcorn", "quic", "reno", "congestion-control", "provider", "http3"]

[project.entry-points."tigrcorn.quic_cc.v1"]
reno = "tigrcorn_quic_cc_reno:factory"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.package-data]
tigrcorn_quic_cc_reno = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
tigrcorn-quic-cc = { workspace = true }
